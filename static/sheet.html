<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Sheet</title>
  <link rel="icon" type="image/png" href="/static/d20.png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/sheet.css">
</head>
<body>
<div class="sheet-page">

  <div class="sheet-topbar">
    <a href="/portal" class="sheet-back">← My Characters</a>
    <div class="sheet-topbar-right">
      <span id="sheet-user-name" style="font-family:var(--font-book);font-size:0.9rem;color:var(--color-light-dim)"></span>
      <a href="/auth/logout" class="btn-logout">Sign out</a>
    </div>
  </div>

  <div id="sheet-loading" style="padding:48px;text-align:center;font-family:var(--font-book);color:var(--color-light-dim)">Loading character…</div>
  <div id="sheet-root" class="hidden"></div>

</div>
<div class="toast" id="toast"></div>
<script src="/static/sheet.js"></script>
</body>
</html>
